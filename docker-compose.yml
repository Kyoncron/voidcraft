services:
  mc:
    build: .
    container_name: mineworld
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      JAVA_XMS: ${XMS}
      JAVA_XMX: ${XMX}
      ENABLE_RCON: ${ENABLE_RCON}
      RCON_PASS: ${RCON_PASS}
      SECURE_PROFILE: ${SECURE_PROFILE}
      GAMEMODE: ${GAMEMODE}
      HARDCORE: ${HARDCORE}
      MAX_PLAYERS: ${MAX_PLAYERS}
      MOTD: ${MOTD}
      PVP: ${PVP}
      ONLINE_MODE: ${ONLINE_MODE}
      DIFFICULTY: ${DIFFICULTY}
      PARAMS: ${PRAMS}
    ports:
      - ${TCP_PORT}/tcp
      - ${UDP_PORT}/udp
      - ${MOD_PORTS}
      - ${VOICE_PORTS}/udp

    expose:
      - "${RCON_PORT}"

    volumes:
      - ${DIRDATA}:/data
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true